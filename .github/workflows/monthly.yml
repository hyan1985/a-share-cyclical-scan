name: 每月更新基础数据

on:
  schedule:
    # 每月 1 日 20:00 北京时间（UTC 12:00）
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt tushare

      - name: 刷新财务、主营业务与估值面板
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python tools/refresh.py --token "$TUSHARE_TOKEN" --full

      - name: 提交数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --quiet --cached; then
            echo "没有变化"
          else
            git commit -m "data: 月度更新 $(date -u +%Y-%m-%d)"
            git push
          fi
