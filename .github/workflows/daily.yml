name: 每日刷新面板

on:
  schedule:
    # 19:30 北京时间（UTC 11:30），收盘后数据基本已入库
    - cron: "30 11 * * 1-5"
  # 代码或数据有变动时也刷新一次
  push:
    branches: [main]
    paths:
      - "cyclical/**"
      - "tools/**"
      - "data/**"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt tushare

      - name: 拉取数据并重建面板
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python tools/refresh.py --token "$TUSHARE_TOKEN"

      - name: 检查产物
        run: |
          test -f docs/index.html || { echo "面板没生成"; exit 1; }
          ls -lh docs/index.html

      - uses: actions/configure-pages@v5
        with:
          # 让 action 自己启用 Pages（需要 pages: write 权限）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# 部署说明：daily.yml 只负责刷新与部署，数据提交由 monthly.yml 完成。

